services:
  grafana:
    image: docker.io/grafana/grafana:latest@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: grafana
    restart: unless-stopped
    ports:
     - '3000:3000'


  grafana-oss-team-sync:
    image: localhost/grafana-oss-team-sync:dev
    container_name: grafana-oss-team-sync
    build:
      context: ../
      dockerfile: build/package/Dockerfile
    environment:
      GOTS_HOST: "grafana:3000"
      GOTS_RETRY: 10
      GOTS_AUTHFILE: "/app/.env"
      GOTS_CONFIG: "/app/configs/config.yaml"
    volumes:
      - '../:/app:Z'
