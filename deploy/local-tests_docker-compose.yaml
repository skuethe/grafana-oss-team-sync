services:
  grafana:
    image: docker.io/grafana/grafana:latest@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: grafana
    restart: unless-stopped
    ports:
     - '3000:3000'


  grafana-oss-team-sync:
    image: localhost/grafana-oss-team-sync:dev
    container_name: grafana-oss-team-sync
    build:
      context: ../
      dockerfile: build/package/Dockerfile
    environment:
      GOTS_HOST: "grafana:3000"
      GOTS_RETRY: 10
      GOTS_AUTHFILE: "/app/.env"
      GOTS_CONFIG: "/app/configs/config.yaml"
    volumes:
      - '../:/app:Z'
